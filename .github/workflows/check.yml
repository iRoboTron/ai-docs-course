name: Проверки курса

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Структура, ссылки, схемы, запуск лабораторных
        run: python3 scripts/check_project.py
      - name: Ноутбуки соответствуют исходникам
        run: python3 scripts/build_notebooks.py --check
      - name: Скрипты деплоя синтаксически корректны
        run: bash -n deploy-pxhome.sh scripts/remote-deploy.sh
